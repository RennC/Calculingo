        const { useState, useEffect, useRef } = React;

        function LatexRenderer({ text }) {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.renderMathInElement) {
                    window.renderMathInElement(containerRef.current, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false}
                        ],
                        throwOnError: false
                    });
                }
            }, [text]);
            return <span ref={containerRef} className="whitespace-pre-wrap">{text}</span>;
        }

        function App() {
            const [velas, setVelas] = useState(5);
            const [graus, setGraus] = useState(0);
            const [areaSelecionada, setAreaSelecionada] = useState(null);
            const [faseAtual, setFaseAtual] = useState(null);
            const [indiceQuestao, setIndiceQuestao] = useState(0);
            const [opcoesEmbaralhadas, setOpcoesEmbaralhadas] = useState([]);
            const [animacao, setAnimacao] = useState(null);

            useEffect(() => {
                if (faseAtual && faseAtual.questoes && faseAtual.questoes[indiceQuestao]) {
                    const q = faseAtual.questoes[indiceQuestao];
                    const opcoesMapeadas = q.opcoes.map((texto, index) => ({
                        texto: texto,
                        correta: index === q.respostaCorreta
                    }));
                    const shuffled = [...opcoesMapeadas];
                    for (let i = shuffled.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                    }
                    setOpcoesEmbaralhadas(shuffled);
                }
            }, [faseAtual, indiceQuestao]);

            const Header = ({ title }) => (
                <header className="flex justify-between items-center p-4 border-b border-tinta bg-pergaminho sticky top-0 z-10 shrink-0">
                    <div className="text-xl font-bold flex items-center gap-1">
                        <span>{velas}</span> <span>🕯️</span>
                    </div>
                    {title && <div className="text-sm font-semibold text-tinta/80 italic text-center px-2">{title}</div>}
                    <div className="text-xl font-bold flex items-center gap-1">
                        <span>{graus}</span> <span>🧭</span>
                    </div>
                </header>
            );

            if (velas <= 0) {
                return (
                    <div className="flex flex-col items-center justify-center h-full min-h-dvh md:min-h-0 bg-tinta text-pergaminho p-6 text-center">
                        <h1 className="text-4xl mb-8 font-bold">A escuridão tomou conta</h1>
                        <button 
                            onClick={() => {
                                setVelas(5);
                                setFaseAtual(null);
                                setAreaSelecionada(null);
                            }}
                            className="text-lg border-2 border-pergaminho px-6 py-3 hover:bg-pergaminho hover:text-tinta transition-all uppercase tracking-widest"
                        >
                            Acender Velas
                        </button>
                    </div>
                );
            }

            if (areaSelecionada === null) {
                return (
                    <div className="flex flex-col h-full min-h-dvh md:min-h-0 bg-pergaminho no-scrollbar overflow-y-auto">
                        <Header />
                        <main className="flex-grow flex flex-col items-center justify-center p-6 pb-12">
                            <h1 className="text-3xl md:text-5xl text-center mb-10 md:mb-16 font-bold leading-snug">Qual tratado<br/>desejas decifrar?</h1>
                            <div className="flex flex-col md:flex-row gap-6 w-full max-w-[320px] md:max-w-3xl justify-center">
                                <button 
                                    onClick={() => setAreaSelecionada('matematica')}
                                    className="w-full p-8 md:p-12 border-2 border-tinta hover:bg-tinta/5 hover:border-destaque transition-all text-2xl md:text-3xl leading-relaxed text-center"
                                >
                                    A Arte da<br/>Matemática
                                </button>
                                <button 
                                    onClick={() => setAreaSelecionada('fisica')}
                                    className="w-full p-8 md:p-12 border-2 border-tinta hover:bg-tinta/5 hover:border-destaque transition-all text-2xl md:text-3xl leading-relaxed text-center"
                                >
                                    A Filosofia<br/>Natural
                                </button>
                            </div>
                        </main>
                    </div>
                );
            }

            if (faseAtual === null) {
                const fases = window.BANCO_DE_QUESTOES && window.BANCO_DE_QUESTOES[areaSelecionada] ? window.BANCO_DE_QUESTOES[areaSelecionada] : [];
                return (
                    <div className="flex flex-col h-full min-h-dvh md:min-h-0 bg-pergaminho no-scrollbar overflow-y-auto">
                        <Header />
                        <main className="flex-grow flex flex-col items-center p-6 pb-12 w-full max-w-4xl mx-auto">
                            <h1 className="text-3xl md:text-4xl mb-8 uppercase tracking-widest border-b border-tinta pb-2">Trilha</h1>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full md:gap-6">
                                {fases.map((fase, idx) => {
                                    return (
                                        <button 
                                            key={idx}
                                            onClick={() => {
                                                setFaseAtual(fase);
                                                setIndiceQuestao(0);
                                                setAnimacao(null);
                                            }}
                                            className="p-5 md:p-8 border-2 flex flex-col justify-center items-center text-xl md:text-2xl transition-all w-full text-center border-tinta bg-pergaminho hover:bg-tinta hover:text-pergaminho text-tinta"
                                        >
                                            <span className="font-semibold">{idx + 1}. {fase.nome || 'Desconhecida'}</span>
                                        </button>
                                    );
                                })}
                            </div>
                            <button 
                                onClick={() => setAreaSelecionada(null)}
                                className="mt-10 text-xl md:text-2xl border-b border-tinta hover:text-destaque hover:border-destaque pb-1"
                            >
                                &larr; Voltar
                            </button>
                        </main>
                    </div>
                );
            }

            const questao = faseAtual.questoes[indiceQuestao];
            if (!questao) {
                return (
                    <div className="flex flex-col h-full min-h-dvh md:min-h-0 bg-pergaminho items-center justify-center p-6 text-center">
                        <h1 className="text-4xl mb-6 font-bold text-green-800">Tratado Concluído!</h1>
                        <button 
                            onClick={() => setFaseAtual(null)}
                            className="text-xl border-2 border-tinta px-6 py-3 hover:bg-tinta hover:text-pergaminho transition-all"
                        >
                            Retornar à Trilha
                        </button>
                    </div>
                );
            }

            const responder = (correta) => {
                if (animacao) return;

                if (correta) {
                    setAnimacao('acerto');
                    setTimeout(() => {
                        setAnimacao(null);
                        setGraus(g => g + 25);
                        setIndiceQuestao(i => i + 1);
                    }, 1200);
                } else {
                    setAnimacao('erro');
                    setTimeout(() => {
                        setAnimacao(null);
                        setVelas(v => v - 1);
                        
                        setFaseAtual(fase => {
                            const novaFase = { ...fase };
                            const questaoAtual = novaFase.questoes[indiceQuestao];
                            novaFase.questoes = [...novaFase.questoes];
                            novaFase.questoes.push(questaoAtual);
                            return novaFase;
                        });
                        
                        setIndiceQuestao(i => i + 1);
                    }, 1200);
                }
            };

            return (
                <div className="flex flex-col h-full min-h-dvh md:min-h-0 bg-pergaminho no-scrollbar overflow-y-auto">
                    <Header title={`Questão ${indiceQuestao + 1}`} />
                    <main className="flex-grow flex flex-col items-center p-4 pb-12 w-full max-w-4xl mx-auto">
                        <div className="w-full flex justify-start mb-4 max-w-[360px] md:max-w-2xl">
                            <button 
                                onClick={() => setFaseAtual(null)}
                                className="text-lg md:text-xl font-medium border-b border-tinta hover:text-destaque hover:border-destaque transition-colors flex items-center gap-2"
                            >
                                &larr; Retornar ao Mapa
                            </button>
                        </div>
                        <div className={`w-full max-w-[360px] md:max-w-2xl p-5 md:p-8 border-2 shadow-sm transition-all duration-300 flex flex-col ${
                            animacao === 'erro' ? 'border-red-600 bg-red-100/50 animate-shake' : 
                            animacao === 'acerto' ? 'border-green-600 bg-green-100/50 animate-pulse-green' : 'border-tinta bg-pergaminho/30'
                        }`}>
                            <h2 className="text-xl md:text-2xl mb-6 md:mb-8 leading-relaxed font-bold border-b border-tinta/30 pb-4">
                                <LatexRenderer text={questao.pergunta} />
                            </h2>
                            <div className="flex flex-col gap-3 md:gap-5">
                                {opcoesEmbaralhadas.map((op, idx) => {
                                    let btnClasses = "border-tinta/40 hover:bg-tinta/10";
                                    if (animacao !== null) {
                                        if (op.correta) {
                                            btnClasses = "border-green-600 bg-green-600/20 text-green-900 font-bold";
                                        } else {
                                            btnClasses = "border-tinta/20 text-tinta/40 opacity-50";
                                        }
                                    }
                                    return (
                                        <button 
                                            key={idx}
                                            disabled={animacao !== null}
                                            onClick={() => responder(op.correta)}
                                            className={`text-left text-[1.1rem] md:text-xl leading-snug p-4 md:p-6 border transition-colors font-medium ${btnClasses}`}
                                        >
                                            <LatexRenderer text={op.texto} />
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
